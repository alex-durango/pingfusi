# Lives in the PUBLIC repo (alex-durango/pingfusi). Tag vX.Y.Z (pushed by the
# monorepo's release workflow) → wait for Alex's one-click approval on the
# npm-publish environment → publish to npm via trusted publishing (OIDC, no
# token exists anywhere) → smoke-test what actually shipped.
#
# This file is NOT generated by build-public.js — the generator's sweep exempts
# .github/ precisely so the public repo can own its publish workflow.
name: publish
on:
  push:
    tags: ['v*']

permissions:
  id-token: write   # npm trusted publishing (OIDC)
  contents: read

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    environment: npm-publish   # required reviewer: alex-durango
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@latest && npm --version
      - name: version sanity
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }
      - name: publish (OIDC — configure trusted publishing on npmjs.com first)
        run: npm publish

  smoke:
    needs: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: fresh-user install check (neutral cwd)
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          cd "$(mktemp -d)"
          # npm now holds a freshly published version for asynchronous processing
          # ("Your package is being processed and may take a few minutes to become
          # available" — first seen on 0.17.1, 2026-09-03, when a 2.5-minute window
          # turned a successful publish into a red run). Give it up to 15 minutes.
          for i in $(seq 1 30); do
            GOT=$(npx -y "pingfusi@$TAG" version 2>/dev/null || true)
            [ "$GOT" = "$TAG" ] && break
            echo "attempt $i: got '$GOT', want '$TAG' — waiting"; sleep 30
          done
          [ "$GOT" = "$TAG" ] || { echo "::error::npx pingfusi@$TAG version returned '$GOT' after 15 minutes"; exit 1; }
      - name: packed layout + lazy motion install
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          cd "$(mktemp -d)"
          npm pack "pingfusi@$TAG" && tar xf pingfusi-*.tgz
          node package/bin/pingfusi version
          node package/bin/pingfusi motion install
